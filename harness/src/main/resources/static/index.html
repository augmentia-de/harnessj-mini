<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Harness Web UI</title>
<style>
body { font-family: monospace; margin: 20px; background: #1e1e1e; color: #d4d4d4; }
textarea { width: 100%; height: 80px; background: #2d2d2d; color: #d4d4d4; border: 1px solid #555; }
button { padding: 8px 16px; margin-top: 8px; cursor: pointer; }
#output { white-space: pre-wrap; background: #2d2d2d; padding: 12px; margin-top: 12px; border: 1px solid #555; min-height: 200px; }
</style>
</head>
<body>
<h1>Harness Web UI</h1>
<textarea id="task" placeholder="Task eingeben..."></textarea><br>
<button onclick="run()">Run</button>
<div id="output"></div>
<script>
function run() {
    const task = document.getElementById('task').value;
    const out = document.getElementById('output');
    out.textContent = 'Running...\n';
    const es = new EventSource('/api/run?task=' + encodeURIComponent(task));
    // EventSource only GET; use fetch with SSE manually
    es.close();
    fetch('/api/run', { method: 'POST', body: task, headers: { 'Content-Type': 'text/plain' } })
        .then(r => {
            const reader = r.body.getReader();
            const decoder = new TextDecoder();
            function read() {
                reader.read().then(({done, value}) => {
                    if (done) return;
                    out.textContent += decoder.decode(value);
                    read();
                });
            }
            read();
        });
}
</script>
</body>
</html>
