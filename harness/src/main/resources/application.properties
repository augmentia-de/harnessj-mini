# Harness configuration (mapped from .env / environment variables)
harness.base-url=${LLM_BASE_URL:https://api.openai.com/v1}
harness.api-key=${LLM_API_KEY:}
harness.model=${LLM_MODEL:gpt-4o-mini}
harness.session-id=${LLM_SESSION_ID:}
harness.max-turns=${LLM_MAX_TURNS:50}
harness.max-cost=${LLM_MAX_COST:5.0}
harness.compact-at-tokens=${LLM_COMPACT_AT_TOKENS:100000}
harness.max-retries=${LLM_MAX_RETRIES:3}
harness.retry-backoff-ms=${LLM_RETRY_BACKOFF_MS:1000}

# Spring
server.port=${SERVER_PORT:18000}
server.tomcat.async-timeout=0
spring.main.banner-mode=off
logging.level.root=DEBUG
logging.level.java.lang.ProcessBuilder=WARN