services:
  harness:
    build: .
    container_name: harness
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - SERVER_PORT=18000
      - LOG_DIR=/data/log
    volumes:
      - ./logs:/data/log
      - ./workspace:/workspace
    working_dir: /workspace
    ports:
      - "127.0.0.1:18000:18000"
    user: "${UID:-1000}:${GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    privileged: false