<!DOCTYPE html>
<html lang="de">
<head><meta charset="UTF-8"><title>Harness2</title></head>
<body>
<h1>Harness2 (Quarkus + LangChain4j)</h1>
<textarea id="task" style="width:100%;height:80px"></textarea><br>
<button onclick="run()">Run</button>
<pre id="out" style="background:#222;color:#ddd;padding:12px"></pre>
<script>
function run(){
  const t=document.getElementById('task').value;
  const out=document.getElementById('out');
  out.textContent='Running...\n';
  fetch('/api/run',{method:'POST',body:t,headers:{'Content-Type':'text/plain'}})
    .then(r=>r.text()).then(x=>out.textContent+='\n'+x);
}
</script>
</body>
</html>
