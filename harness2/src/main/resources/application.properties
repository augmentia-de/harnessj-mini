quarkus.http.port=${QUARKUS_HTTP_PORT:18004}
quarkus.http.host=0.0.0.0

llm.base-url=${LLM_BASE_URL:https://api.openai.com/v1}
llm.api-key=${LLM_API_KEY:}
llm.model=${LLM_MODEL:gpt-4o-mini}

quarkus.log.level=INFO
quarkus.log.file.enable=true
quarkus.log.file.path=${LOG_DIR:./logs}/harness2.log
quarkus.log.file.rotation.max-file-size=2M
quarkus.log.file.rotation.max-backup-index=10
quarkus.log.file.rotation.file-suffix=.yyyy-MM-dd